<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; worker-src 'self';">
<title>Grove 代码查看器</title><link rel="stylesheet" href="editor.css">
<style>
:root{--surface:#1e1f22;--panel:#191a1c;--border:#393b40;--text:#dfe1e5;--muted:#9b9fa6;--secondary:#b4b8bf;--disabled:#858b95;--subtle-border:#2f3134;--focus-ring:#8ab4ff;--accent:#5e95f8;--focus:#3574f0;--selection:#2e436e;--hover:#36383d;--input:#1b1c1f;--card:#25272a;--card-border:#3c3f45;--code-font:GitXIdeaMono,"JetBrains Mono","Cascadia Mono",Consolas,"Microsoft YaHei UI",monospace;--code-font-size:14px;--code-line-height:22px}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--surface);color:var(--text);font:var(--ui-font-size)/1.45 var(--ui-font)}body{display:flex;flex-direction:column}#editor-header{flex:none}[hidden]{display:none!important}
#document-notice{padding:20px 24px;white-space:pre-wrap;overflow:auto;color:var(--muted);line-height:1.8;overflow-wrap:anywhere}
#editor-tab{display:flex;align-items:center;height:28px;padding:0 7px;border-bottom:1px solid #2b2d30}
#source-tabs{display:flex;align-items:stretch;overflow-x:auto;overflow-y:hidden;min-width:0;width:100%;height:28px;color-scheme:dark}#source-tabs::-webkit-scrollbar{height:4px;background:var(--surface)}#source-tabs::-webkit-scrollbar-thumb{background:#4b4e55;border-radius:2px}#source-tabs::-webkit-scrollbar-button{display:none}.source-tab{display:flex;align-items:center;flex:none;min-width:0;max-width:300px;border-right:1px solid #2b2d30;border-bottom:2px solid transparent}.source-tab.active{background:#25272a;border-bottom-color:var(--focus)}.source-tab button{border:0;background:transparent;color:var(--muted);font:inherit;cursor:pointer;min-width:0}.source-tab [role=tab]{padding:4px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;align-self:stretch}.source-tab.active [role=tab]{color:var(--text)}.source-tab:hover{background:var(--card)}.source-tab button:focus-visible{outline:1px solid var(--focus-ring);outline-offset:-2px}.source-tab .close-source-tab{display:grid;place-items:center;width:22px;height:22px;flex:none;padding:3px;margin-right:3px;border-radius:3px}.close-source-tab:hover{background:var(--hover);color:var(--text)}
#file-path{display:flex;align-items:center;gap:4px;max-width:90%;height:24px;padding:0 6px;background:#25272a;border:0;border-bottom:2px solid var(--focus);border-radius:0;white-space:nowrap;overflow:hidden}#file-parent{display:none}#file-name{overflow:hidden;text-overflow:ellipsis}#tab-caption{color:#a9b8cd}#close-file{width:18px;height:20px;padding:0;color:var(--muted);border:0;background:transparent;cursor:pointer}
#editor-tools{display:flex;align-items:center;gap:3px;min-height:26px;padding:0 7px;box-sizing:border-box;flex:none}
#editor-tools button,#editor-tools summary,#editor-tools select{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:24px;box-sizing:border-box;border:1px solid transparent;border-radius:4px;background:transparent;color:var(--secondary);font:inherit;cursor:pointer;white-space:nowrap;padding:1px 5px}
#editor-tools select{height:24px;max-width:180px;border-color:transparent;background:var(--surface);padding:0 6px;color-scheme:dark}#editor-tools option{background:var(--panel);color:var(--text)}
#editor-tools select:hover:not(:disabled){border-color:var(--border);background:#27292d}#editor-tools select:disabled{opacity:1;color:var(--disabled);cursor:default}
#editor-tools button[aria-pressed="true"]{background:var(--selection);color:var(--accent)}
#editor-tools button:active:not(:disabled),#editor-tools summary:active{background:#41444b}
#editor-tools button,#editor-tools summary,#editor-tools select{transition:background-color 100ms ease-out,color 100ms ease-out,border-color 100ms ease-out}
#editor-tools button:hover:not(:disabled),#editor-tools summary:hover{background:var(--hover)}#editor-tools button:disabled{opacity:1;color:var(--disabled);cursor:default}
#editor-tools button:focus-visible,#editor-tools select:focus-visible,#editor-tools summary:focus-visible{outline:1px solid var(--focus-ring);outline-offset:-1px}
.ui-icon{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tool-separator{height:18px;border-left:1px solid var(--subtle-border);margin:0 4px}.viewer-mode{padding:1px 6px;color:var(--secondary);white-space:nowrap}
#status{display:none;margin-left:auto;min-width:0;align-items:center;position:relative}.diff-mode #status{display:flex}#change-count{font-size:var(--ui-secondary-font-size);color:#9b9fa6;white-space:nowrap;font-variant-numeric:tabular-nums}
#tool-feedback{position:absolute;inset:0 0 0 auto;min-width:100%;box-sizing:border-box;background:var(--surface);color:var(--text);font-size:var(--ui-secondary-font-size);text-align:right;white-space:nowrap;display:flex;align-items:center;justify-content:flex-end}
.diff-only{display:none!important}.diff-mode .diff-only{display:inline-flex!important}
#diff-more{position:relative}#diff-more summary{list-style:none}#diff-more[open] summary{background:var(--selection)}
#fold-controls{position:fixed;z-index:30;display:flex;flex-direction:column;gap:0;width:212px;box-sizing:border-box;overflow:auto;padding:4px;background:#27282c;border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 12px #0005}
#editor-tools #fold-controls button{justify-content:flex-start;gap:8px;height:26px;min-height:26px;padding:3px 8px;color:var(--text);border:0;border-radius:3px}#fold-controls .comment-toolbar{display:flex;flex-direction:column;align-items:stretch;gap:0;min-height:0;padding:0;border:0;background:transparent}
#editor-tools #fold-controls button:hover:not(:disabled),#editor-tools #fold-controls button:focus-visible{background:var(--selection);outline:none}
#toggle-minimap[aria-checked="false"] .ui-icon{visibility:hidden}
#diff-more[open] #fold-controls{animation:tool-popup-in 120ms ease-out both;transform-origin:top right}
#diff-more.keyboard-open #fold-controls{animation:none}
@keyframes tool-popup-in{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:translateY(0)}}
.blame-menu{position:fixed;z-index:100;width:252px;box-sizing:border-box;overflow:auto;padding:4px;background:#27282c;border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 12px #0005}
.blame-menu button{display:flex;align-items:center;gap:8px;width:100%;box-sizing:border-box;min-height:26px;padding:3px 8px;border:0;border-radius:3px;background:transparent;color:var(--text);font:inherit;text-align:left;cursor:pointer}
.blame-menu button:hover:not(:disabled),.blame-menu button:focus-visible{background:var(--selection);outline:none}.blame-menu button:disabled{opacity:1;color:var(--disabled);cursor:default}.blame-row:focus-visible{outline:1px solid var(--focus-ring);outline-offset:-1px}
.blame-view-menu{width:180px;z-index:101}.blame-menu hr{margin:4px 6px;border:0;border-top:1px solid #2f3134}.submenu-arrow{margin-left:auto}#source-revision{min-width:0;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--ui-secondary-font-size);color:var(--muted);padding:0 5px}
#headers{display:none;flex:none}.diff-mode #headers{display:grid;grid-template-columns:minmax(0,1fr) 24px minmax(0,1fr);height:var(--code-line-height);box-sizing:border-box;border-bottom:1px solid var(--subtle-border);background:#1b1c1e}
.side-header{display:flex;align-items:center;gap:8px;min-width:0;padding:0 7px;color:var(--secondary);font-size:var(--ui-secondary-font-size);white-space:nowrap}.side-revision-label{display:inline-flex;align-items:baseline;min-width:0;max-width:55%;flex:none}.side-access{color:var(--muted);white-space:pre}.side-revision{font-family:var(--code-font);overflow:hidden;text-overflow:ellipsis}.side-path{display:flex;min-width:0;overflow:hidden;color:var(--muted)}.side-directory{overflow:hidden;text-overflow:ellipsis;min-width:0}.side-filename{flex:none;max-width:100%;overflow:hidden;text-overflow:ellipsis}.side-format{margin-left:auto;flex:none;color:var(--muted);font-size:var(--ui-secondary-font-size)}.side-format.attention{color:#d9ac65}
#new-label{display:none}.include-file-label{display:flex;align-items:center;gap:5px;cursor:pointer}
input[type=checkbox]{appearance:none;width:14px;height:14px;box-sizing:border-box;border:1px solid #92979e;border-radius:2px;background:transparent;margin:0;cursor:pointer;flex:none}
input[type=checkbox]:checked{background:#548af0;border-color:#548af0}input[type=checkbox]:checked:after{content:'';display:block;width:7px;height:4px;border-left:1.5px solid white;border-bottom:1.5px solid white;transform:translate(2px,2px) rotate(-45deg)}
input[type=checkbox]:indeterminate{background:linear-gradient(#aeb5bd,#aeb5bd) center/7px 1.5px no-repeat}input[type=checkbox]:focus-visible{outline:1px solid #75a6fb;outline-offset:2px}
#workspace{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);isolation:isolate}.diff-mode #workspace{grid-template-columns:minmax(0,1fr) 24px minmax(0,1fr)}
#workspace.document-preparing{visibility:hidden}
.pane-column{position:relative;z-index:2;display:grid;min-width:0;min-height:0;overflow:hidden;grid-template-columns:minmax(0,1fr)}.diff-mode #old-column{grid-template-columns:minmax(0,1fr) 54px}.diff-mode #new-column{grid-template-columns:64px minmax(0,1fr)}
#old-column,#divider,.source-gutter{display:none}.diff-mode #old-column{display:grid}.diff-mode #divider,.diff-mode .source-gutter{display:block}
.pane{position:relative;min-width:0;min-height:0;overflow:hidden}.source-gutter{position:relative;background:transparent;z-index:2;overflow:hidden;color:#797e86;font:14px/var(--code-line-height) var(--code-font)}
#old-gutter{border-right:1px solid #2f3135}.source-line{position:absolute;left:0;right:0;height:var(--code-line-height);display:flex;align-items:center;justify-content:flex-end;gap:5px;padding:0 5px;box-sizing:border-box;cursor:default}.source-line span{position:relative;min-width:28px;text-align:right}.source-line .empty-check{width:14px;flex:none}
#divider{position:relative;background:var(--surface);z-index:1}#connectors{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;pointer-events:none}
.connector{fill:#2c3c47;stroke:#4b5a65;stroke-width:1}.connector.added{fill:#294436;stroke:#3f6952}.connector.deleted{fill:#5c3437;stroke:#87545a}.connector.active{stroke:#6a8cb4}
.connector.moved{fill:#454849;stroke:#5d6164}.source-line.modified{background:#2c3c47}.source-line.added{background:#294436}.source-line.deleted{background:#5c3437}.source-line.moved{background:#454849}.source-line.deletion-marker{background:transparent}.deletion-marker:before{content:'';position:absolute;inset:0;border-top:1px solid #87545a;pointer-events:none}.deletion-marker.moved:before{border-color:#5d6164}
.gitx-added-boundary,.gitx-deleted-boundary,.gitx-moved-boundary{box-sizing:border-box;border-top:1px solid #3f6952}.gitx-deleted-boundary{border-color:#87545a}.gitx-moved-boundary{border-color:#5d6164}.gitx-added-boundary-end,.gitx-deleted-boundary-end,.gitx-moved-boundary-end{box-sizing:border-box;border-bottom:1px solid #3f6952}.gitx-deleted-boundary-end{border-color:#87545a}.gitx-moved-boundary-end{border-color:#5d6164}
#block-actions{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}#block-actions button{position:absolute;left:0;width:18px;height:var(--code-line-height);display:grid;place-items:center;padding:0;border:0;border-radius:2px;color:var(--secondary);background:transparent;cursor:pointer;pointer-events:auto}#block-actions button:hover{background:#42454a;color:#fff}#block-actions button:focus-visible{outline:1px solid var(--focus-ring);outline-offset:-1px}
.gitx-modified-line{background:#2c3c47}.gitx-added-line{background:#294436}.gitx-deleted-line{background:#5c3437}.gitx-moved-line{background:#454849}.gitx-modified-text{background:#4b667a;border-radius:1px}
.gitx-gap,.gitx-gap-margin{background:#1e1f22}.gitx-active-change{border-left:2px solid #6a8cb4;margin-left:0}
.gitx-fold-zone[data-expanded="true"]{visibility:hidden;pointer-events:none;border:0}.gitx-fold-zone{background:#25272a;border-top:1px dashed #43464c;border-bottom:1px dashed #43464c;box-sizing:border-box}.gitx-fold-zone button{display:flex;align-items:center;gap:5px;width:100%;height:100%;border:0;padding:0 6px;text-align:left;background:transparent;color:var(--muted);font:var(--ui-secondary-font-size) var(--ui-font);cursor:pointer;white-space:nowrap;overflow:hidden}.gitx-fold-zone button:hover{background:var(--hover)}
#blame-gutter{display:none;position:relative;overflow:hidden;border-right:1px solid var(--border);background:var(--panel);font:var(--ui-font-size)/var(--code-line-height) var(--ui-font)}.blame-mode #workspace{grid-template-columns:var(--blame-width,178px) minmax(0,1fr)}.blame-mode #blame-gutter{display:block}.blame-row{position:absolute;left:0;right:0;height:var(--code-line-height);box-sizing:border-box;display:grid;grid-template-columns:var(--blame-columns);column-gap:8px;padding:0 6px;border-left:3px solid var(--accent);color:var(--muted);font:inherit;white-space:nowrap;overflow:hidden}.blame-field,.blame-local{min-width:0;overflow:hidden;text-overflow:ellipsis}.blame-local{grid-column:1/-1}.blame-row.local{border-left-color:#ddaa55}
@media(max-width:850px){.diff-mode #headers{height:calc(var(--code-line-height) * 2)}.side-header{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 6px}.side-revision-label,.include-file-label{grid-column:1;grid-row:1;max-width:100%;overflow:hidden}.side-path{grid-column:1/-1;grid-row:2}.side-directory{display:none}.side-filename{flex:initial;overflow:hidden;text-overflow:ellipsis}.side-format{grid-column:2;grid-row:1}.side-access{display:none}.diff-mode .viewer-mode{display:none!important}#change-count{font-size:var(--ui-secondary-font-size)}#editor-tools{gap:2px}#editor-tools select{max-width:135px;font-size:var(--ui-secondary-font-size)}.tool-separator{margin:0 2px}}
.source-minimap{display:none;position:relative;overflow:hidden;min-height:0;cursor:pointer}.diff-mode .with-minimap .source-minimap{display:block}.diff-mode #old-column.with-minimap{grid-template-columns:var(--map-width) minmax(0,1fr) 54px}.diff-mode #new-column.with-minimap{grid-template-columns:64px minmax(0,1fr) var(--map-width)}.source-minimap canvas{display:block}.map-viewport{position:absolute;left:0;right:0;pointer-events:none;background:#7d818b22;border:1px solid #7d818b55;box-sizing:border-box}
.source-line:not(.deletion-marker) input:not(:checked):not(:focus-visible){opacity:.22}.source-line:hover input,.source-line:focus-within input{opacity:1!important}
.source-minimap canvas{opacity:.58;transition:opacity 100ms ease-out}.source-minimap:hover canvas,.source-minimap:focus-within canvas{opacity:.9}
@media(prefers-reduced-motion:reduce){#editor-tools button,#editor-tools summary,#editor-tools select,.source-minimap canvas{transition:none}#diff-more[open] #fold-controls{animation:none}}
.file-history-diff #editor-tab,.file-history-diff .comment-toolbar{display:none!important}
.file-history-diff:not(.diff-mode) #editor-tools{display:none}
#source-save-state{font-size:var(--ui-secondary-font-size);color:var(--muted);min-width:0;max-width:270px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}#source-save-state.attention{color:var(--text)}.source-tab [role=tab].has-text-draft::before{content:'●';font-size:8px;color:var(--accent);padding-right:5px}@media(max-width:850px){#source-save-state{max-width:140px}}
</style></head><body>
<div id="editor-header">
 <div id="editor-tab"><div id="source-tabs" role="tablist" aria-label="代码标签页" hidden></div><div id="file-path"><span id="tab-caption">提交:</span><span id="file-parent"></span><span id="file-name">选择文件</span><button id="close-file" title="关闭文件" aria-label="关闭文件">×</button></div></div>
 <div id="editor-tools">
  <span id="markdown-mode" role="group" aria-label="Markdown 阅读方式" hidden><button id="markdown-source" aria-pressed="false" title="查看只读源码；Ctrl+F 在源码中搜索">源码</button><button id="markdown-rendered" aria-pressed="true" title="预览；HTML 按文本显示，远程图片不自动加载">预览</button></span>
  <button class="diff-only" id="previous-change" title="上一处差异 · Shift+F7" aria-label="上一处差异"></button><button class="diff-only" id="next-change" title="下一处差异 · F7" aria-label="下一处差异"></button>
  <span class="tool-separator diff-only"></span><span class="viewer-mode diff-only" title="当前为并排只读视图">并排 · 只读</span>
  <select class="diff-only" id="whitespace-mode" aria-label="空白比较方式"><option value="0">不忽略空白</option><option value="1" selected>修剪首尾空白</option><option value="2">忽略空白</option></select>
  <select class="diff-only" id="highlight-mode" aria-label="差异高亮方式"><option value="words">按词高亮</option><option value="lines">按行高亮</option><option value="none">不高亮</option></select>
  <button class="diff-only" id="toggle-unchanged" aria-label="折叠未变化片段" title="折叠未变化片段" aria-pressed="false"></button>
  <button id="source-symbols" hidden title="当前文件结构 · Ctrl+F12">结构</button><button id="source-history" hidden title="查看当前路径的提交历史；不跟随重命名">文件历史</button><button id="source-save" hidden>保存</button><span id="source-save-state" role="status" hidden></span><span id="source-note-slot"></span><span id="source-revision" hidden></span>
  <div id="status"><span id="change-count" aria-label="差异与包含数量"></span><span id="tool-feedback" role="status" aria-live="polite" hidden></span></div>
  <details id="diff-more"><summary title="更多选项" aria-label="更多选项"></summary><div id="fold-controls"><button class="diff-only" id="expand-all">展开未变化片段</button><button class="diff-only" id="collapse-all">折叠未变化片段</button><button class="diff-only" id="toggle-minimap" aria-pressed="true">显示代码缩略图</button><button id="stage-block" hidden>暂存当前块</button><button id="stage-lines" hidden>暂存选中行</button></div></details>
 </div><div id="editor-messages"></div>
</div>
<section id="markdown-preview" tabindex="0" aria-label="Markdown 预览，只读；Esc 返回源码" hidden><article id="markdown-content"></article></section>
<div id="headers">
 <div class="side-header"><span id="old-label"></span><span class="side-path" id="old-label-path"></span><span class="side-format" id="old-format"></span></div><div></div>
 <div class="side-header"><label class="include-file-label"><input type="checkbox" id="include-file" aria-label="包含当前文件到提交"><span>当前版本 · 只读</span></label><span id="new-label"></span><span class="side-path" id="new-label-path"></span><span class="side-format" id="new-format"></span></div>
</div>
<div id="document-notice" role="status" hidden></div>
<div id="workspace"><div id="blame-gutter" aria-label="逐行 Git 注解"></div><div class="pane-column" id="old-column"><div class="source-minimap" id="old-map"></div><div class="pane" id="old-editor"></div><div class="source-gutter" id="old-gutter"><div id="block-actions"></div></div></div><div id="divider"><svg id="connectors"></svg></div><div class="pane-column" id="new-column"><div class="source-gutter" id="new-gutter"></div><div class="pane" id="new-editor"></div><div class="source-minimap" id="new-map"></div></div></div>
<script src="editor.js"></script></body></html>
