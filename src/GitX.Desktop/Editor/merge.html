<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; worker-src 'self';">
<link rel="stylesheet" href="merge.css"><title>Grove 合并修订</title>
<style>
:root{--surface:#1e1f22;--panel:#2b2d30;--border:#393b40;--text:#dfe1e5;--muted:#9b9fa6;--accent:#5e95f8;--gutter-width:44px;--code-font:GitXIdeaMono,"JetBrains Mono","Cascadia Mono",Consolas,"Microsoft YaHei UI",monospace;--code-font-size:14px;--code-line-height:23px}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--surface);color:var(--text);font:var(--ui-font-size)/1.45 var(--ui-font)}body{display:flex;flex-direction:column}
#headers{display:grid;grid-template-columns:minmax(0,1fr) var(--gutter-width) minmax(0,1fr) var(--gutter-width) minmax(0,1fr);flex:none;background:var(--panel);border-bottom:1px solid var(--border);height:30px;box-sizing:border-box}
.pane-header{display:flex;align-items:center;gap:12px;padding:0 10px;min-width:0}.pane-label{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.version{color:var(--muted);font:var(--ui-secondary-font-size) var(--code-font);white-space:nowrap;margin-left:auto}#result-header{background:var(--surface)}#result-header .version{font-family:inherit}
#load-status{position:absolute;inset:30px 0 0;background:var(--surface);color:var(--muted);padding:24px;z-index:10;white-space:pre-wrap;overflow:auto}#load-status[hidden]{display:none}
#workspace{display:grid;grid-template-columns:minmax(0,1fr) var(--gutter-width) minmax(0,1fr) var(--gutter-width) minmax(0,1fr);flex:1;min-height:0}.pane{min-width:0;min-height:0}.gutter{position:relative;border-left:1px solid var(--border);border-right:1px solid var(--border);background:#27292d;overflow:hidden}.gutter svg{position:absolute;width:100%;height:100%;pointer-events:none}
.gap{background:repeating-linear-gradient(135deg,#282a2f 0,#282a2f 3px,#23252a 3px,#23252a 6px)}.changed{background:#30426077}.conflict{background:#63333777}.handled{background:#244f3e66}.empty-conflict{border-top:2px solid #a95c64}.empty-handled{border-top:2px solid #528c64}.empty-changed{border-top:2px solid #56779d}.current-block{border-left:3px solid var(--accent);margin-left:3px}.connection{fill:#63333788;stroke:#a95c64;stroke-width:1}.connection.done{fill:#244f3e66;stroke:#528c64}.connection.changed{fill:#30426077;stroke:#56779d}
.gutter-actions{position:absolute;left:2px;right:2px;display:flex;justify-content:space-between;z-index:2}.gutter-actions[hidden]{display:none}.gutter-actions button{display:grid;place-items:center;width:18px;height:20px;padding:0;background:var(--panel);color:var(--text);border:1px solid #63666c;border-radius:4px;cursor:pointer}.gutter-actions button:hover{background:#36383d}.gutter-actions button:active{background:#2e436e}.gutter-actions button:focus-visible{outline:2px solid #8ab4ff;outline-offset:-2px}.gutter-actions button:disabled{opacity:.45;cursor:default}.gutter-actions.done button{border-color:#528c64}.gutter-actions .ui-icon{position:static;width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
</style></head><body>
<div id="headers"><div class="pane-header" id="left-header"><span class="pane-label" id="left-label">当前版本</span><span class="version" id="left-version"></span></div><span></span><div class="pane-header" id="result-header"><span class="pane-label">合并结果（可编辑）</span><span class="version">工作区文件</span></div><span></span><div class="pane-header" id="right-header"><span class="pane-label" id="right-label">传入版本</span><span class="version" id="right-version"></span></div></div>
<div id="load-status" role="status">正在加载…</div>
<div id="workspace"><div class="pane" id="left"></div><div class="gutter"><svg id="left-connectors"></svg></div><div class="pane" id="result"></div><div class="gutter"><svg id="right-connectors"></svg></div><div class="pane" id="right"></div></div>
<script src="merge.js"></script></body></html>
