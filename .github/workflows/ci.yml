name: Desktop CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            rid: win-x64
          - os: macos-15
            rid: osx-arm64
          - os: macos-15-intel
            rid: osx-x64
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            src/**/packages.lock.json
            tests/**/packages.lock.json

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: src/GitX.Desktop/Editor/package-lock.json

      - name: Restore, build, test and package
        run: ./tools/ci.ps1 -RuntimeIdentifier '${{ matrix.rid }}'

      - name: Upload test results and build metadata
        if: ${{ always() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: results-${{ matrix.rid }}
          path: |
            artifacts/ci/${{ matrix.rid }}/results/
            artifacts/ci/${{ matrix.rid }}/metadata.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload unsigned application archive
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: desktop-${{ matrix.rid }}
          path: |
            artifacts/ci/${{ matrix.rid }}/desktop-*.zip
            artifacts/ci/${{ matrix.rid }}/desktop-*.tar.gz
            artifacts/ci/${{ matrix.rid }}/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
